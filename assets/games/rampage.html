<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Godzilla Rampage</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0820; overflow: hidden; }
  body {
    display: flex; flex-direction: column; box-sizing: border-box;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #fff;
  }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #pad {
    /* --u: one d-pad key. Sized from the width so the whole pad fits a 375pt phone up to a foldable. */
    --u: clamp(44px, calc((100vw - 104px) / 6), 60px);
    flex: 0 0 auto; box-sizing: border-box; padding: 8px 8px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: linear-gradient(#17112f, #0b0820); border-top: 2px solid #2d2260;
  }
  .dpad { display: grid; grid-template-columns: repeat(3, var(--u)); grid-template-rows: repeat(3, calc(var(--u) * 0.94)); gap: 4px; }
  .btn {
    border: 0; border-radius: 14px; background: #2d2260; color: #fff; font: 700 15px ui-monospace, Menlo, monospace;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #120c2b; touch-action: none;
    padding: 0; letter-spacing: 1px;
  }
  .btn.on { background: #4a3a9c; transform: translateY(2px); box-shadow: 0 2px 0 #120c2b; }
  .btn:focus-visible { outline: 3px solid #ffd43b; }
  .u { grid-column: 2; grid-row: 1; } .l { grid-column: 1; grid-row: 2; } .r { grid-column: 3; grid-row: 2; } .d { grid-column: 2; grid-row: 3; }
  .mid { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .small { width: 44px; height: 44px; border-radius: 22px; font-size: 18px; background: #221a4a; }
  .acts { display: grid; grid-template-columns: calc(var(--u) * 1.35) calc(var(--u) * 1.65); grid-template-rows: calc(var(--u) * 1.35) calc(var(--u) * 1.6); gap: 4px; align-items: center; justify-items: center; }
  .jump { grid-column: 2; grid-row: 2; width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); border-radius: 50%; background: #c2255c; box-shadow: 0 5px 0 #6b0f33; font-size: 16px; }
  .jump.on { background: #e64980; box-shadow: 0 2px 0 #6b0f33; }
  .atk { grid-column: 1; grid-row: 1; width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: 50%; background: #3b3366; color: #b9b3d9; box-shadow: 0 4px 0 #1a1440; font-size: 13px; }
  .atk.ready { background: #f08c00; color: #1b1000; box-shadow: 0 4px 0 #7a4600; }
  .atk.ready.on { background: #ffa94d; }
  #over { position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: center; padding-bottom: 14%; gap: 12px; }
  #over.show { display: flex; }
  #over button { font: 700 15px ui-monospace, Menlo, monospace; letter-spacing: 1px; min-height: 52px; padding: 0 18px; border-radius: 12px; border: 3px solid #fff; color: #fff; background: #c2255c; }
  #over button.alt { background: #2d2260; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" role="img" aria-label="Godzilla Rampage"></canvas>
  <div id="over">
    <button id="again" type="button">TRY AGAIN</button>
    <button id="change" class="alt" type="button">CHANGE HERO</button>
  </div>
</div>
<div id="pad">
  <div class="dpad">
    <button class="btn u" data-k="U" aria-label="Climb up" type="button">▲</button>
    <button class="btn l" data-k="L" aria-label="Move left" type="button">◀</button>
    <button class="btn r" data-k="R" aria-label="Move right" type="button">▶</button>
    <button class="btn d" data-k="D" aria-label="Climb down" type="button">▼</button>
  </div>
  <div class="mid">
    <button class="btn small" id="exit" aria-label="Leave the game" type="button">✕</button>
    <button class="btn small" id="mute" aria-label="Sound on" type="button">♪</button>
  </div>
  <div class="acts">
    <button class="btn atk" id="atk" data-k="A" aria-label="Swing your power-up" type="button">SWING</button>
    <button class="btn jump" data-k="J" aria-label="Jump" type="button">JUMP</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  // ---------------------------------------------------------------------------
  // GODZILLA RAMPAGE — an original comedic arcade platformer for Epic Asia.
  // Climb the girders, dodge what Godzilla throws, grab your power-up
  // (Chris: PICKAXE, Shea: CANDY CANE), rescue Emily / Heather at the top.
  // Everything is drawn in code (pixel maps + rects); no external assets.
  // The host app replaces the INIT placeholder below with JSON:
  //   { highScore, debug }
  // and listens for messages: ready, score, haptic, exit.
  // ---------------------------------------------------------------------------
  var INIT = /*INIT*/null;
  INIT = INIT || {};

  var W = 192, H = 288, HUD = 22;
  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d');

  // ---- host bridge ------------------------------------------------------------
  function post(msg) {
    try {
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      else if (window.parent && window.parent !== window) window.parent.postMessage(Object.assign({ source: 'rampage' }, msg), '*');
    } catch (e) { /* host gone */ }
  }

  // ---- pixel font (5x7) -------------------------------------------------------
  var FONT = {
    A:'01110100011000111111100011000110001', B:'11110100011000111110100011000111110', C:'01110100011000010000100001000101110',
    D:'11110100011000110001100011000111110', E:'11111100001000011110100001000011111', F:'11111100001000011110100001000010000',
    G:'01110100011000010111100011000101111', H:'10001100011000111111100011000110001', I:'01110001000010000100001000010001110',
    J:'00111000100001000010000101001001100', K:'10001100101010011000101001001010001', L:'10000100001000010000100001000011111',
    M:'10001110111010110101100011000110001', N:'10001100011100110101100111000110001', O:'01110100011000110001100011000101110',
    P:'11110100011000111110100001000010000', Q:'01110100011000110001101011001001101', R:'11110100011000111110101001001010001',
    S:'01111100001000001110000010000111110', T:'11111001000010000100001000010000100', U:'10001100011000110001100011000101110',
    V:'10001100011000110001100010101000100', W:'10001100011000110101101011010101010', X:'10001100010101000100010101000110001',
    Y:'10001100010101000100001000010000100', Z:'11111000010001000100010001000011111',
    '0':'01110100011001110101110011000101110', '1':'00100011000010000100001000010001110', '2':'01110100010000100010001000100011111',
    '3':'11111000100010000010000011000101110', '4':'00010001100101010010111110001000010', '5':'11111100001111000001000011000101110',
    '6':'00110010001000011110100011000101110', '7':'11111000010001000100010000100001000', '8':'01110100011000101110100011000101110',
    '9':'01110100011000101111000010001001100',
    '!':'00100001000010000100001000000000100', '?':'01110100010000100010001000000000100', '.':'00000000000000000000000000110001100',
    ':':'00000011000110000000011000110000000', '-':'00000000000000011111000000000000000', "'":'00100001000100000000000000000000000',
    ',':'00000000000000000000011000010001000', '/':'00001000100001000100010000100010000', '+':'00000001000010011111001000010000000',
    '*':'00000010101111111111011100010000000', '#':'01010111110101011111010100000000000'
  };
  function textW(s, sc) { return s.length * 6 * sc - sc; }
  function text(s, x, y, sc, col, align, shadow) {
    s = String(s).toUpperCase(); sc = sc || 1;
    if (align === 'c') x = Math.round(x - textW(s, sc) / 2);
    else if (align === 'r') x = Math.round(x - textW(s, sc));
    if (shadow) text(s, x + sc, y + sc, sc, shadow, null, null);
    ctx.fillStyle = col;
    for (var i = 0; i < s.length; i++) {
      var g = FONT[s[i]];
      if (g) for (var b = 0; b < 35; b++) if (g.charCodeAt(b) === 49) ctx.fillRect(x + (b % 5) * sc, y + ((b / 5) | 0) * sc, sc, sc);
      x += 6 * sc;
    }
  }

  // ---- sprites (pixel maps) ----------------------------------------------------
  // Heroes and princesses are PLACEHOLDERS until the reference photos: each
  // is a palette over shared frames, so a person's look is mostly their
  // palette (hair, skin, beard, clothes) plus a few hair/beard rows.
  var HERO_FRAMES = {
    stand: ['...HHHHH....','..HHHHHHH...','..HHSSSSS...','..HSSESSES..','..SSSSSSSS..','..BSSSMMS...','...BBBBB....','...TTTTT....','..TTUTUTT...','.STTUTUTTS..','.S.TTTTT.S..','...PPPPP....','...PP.PP....','...PP.PP....','...KK.KK....','..KKK.KKK...'],
    walk1: ['...HHHHH....','..HHHHHHH...','..HHSSSSS...','..HSSESSES..','..SSSSSSSS..','..BSSSMMS...','...BBBBB....','...TTTTT....','..TTUTUTT...','.STTUTUTTS..','.S.TTTTT.S..','...PPPPP....','..PP...PP...','..PP...PP...','..KK...KK...','.KKK...KKK..'],
    walk2: ['...HHHHH....','..HHHHHHH...','..HHSSSSS...','..HSSESSES..','..SSSSSSSS..','..BSSSMMS...','...BBBBB....','...TTTTT....','..TTUTUTT...','..STUTUTTS..','..STTTTTS...','...PPPPP....','....PPP.....','....PPP.....','....KKK.....','...KKKK.....'],
    jump:  ['...HHHHH....','..HHHHHHH...','..HHSSSSS...','..HSSESSES..','..SSSSSSSS..','..BSSSMMS...','S..BBBBB..S.','S..TTTTT..S.','.STTUTUTTS..','..TTUTUTT...','...TTTTT....','...PPPPP....','..PP...PP...','.KK.....KK..','............','............'],
    climb: ['...HHHHH....','..HHHHHHH...','..HHHHHHH...','..HHHHHHH...','..SHHHHHS...','...SSSSS....','S..TTTTT..S.','S.TTTTTTT.S.','.STTTTTTTS..','...TTTTT....','...TTTTT....','...PPPPP....','...PP.PP....','..PP...PP...','..KK...KK...','............'],
    swing: ['...HHHHH....','..HHHHHHH...','..HHSSSSS...','..HSSESSES..','..SSSSSSSS..','..BSSSMMS...','...BBBBB....','...TTTTTSS..','..TTUTUTT...','..TTUTUTT...','...TTTTT....','...PPPPP....','..PP...PP...','..PP...PP...','..KK...KK...','.KKK...KKK..']
  };
  var PRINCESS_FRAMES = {
    stand: ['...HHHHHH...','..HHHHHHHH..','..HSSSSSSH..','..HSESSESH..','..HSSSSSSH..','..HSSMMSSH..','..HHSSSSHH..','..HHDDDDHH..','...DDDDDD...','..SDDWWDDS..','..SDDDDDDS..','...DDDDDD...','..DDDDDDDD..','..DDDDDDDD..','.DDDDDDDDDD.','.DDDDDDDDDD.','...SS..SS...','...KK..KK...'],
    wave:  ['...HHHHHH..S','..HHHHHHHH.S','..HSSSSSSH.S','..HSESSESH.S','..HSSSSSSH.S','..HSSMMSSHS.','..HHSSSSHHS.','..HHDDDDHDS.','...DDDDDDD..','..SDDWWDD...','..SDDDDDD...','...DDDDDD...','..DDDDDDDD..','..DDDDDDDD..','.DDDDDDDDDD.','.DDDDDDDDDD.','...SS..SS...','...KK..KK...']
  };
  var HEROES = {
    chris: {
      name: 'CHRIS', wife: 'emily', power: 'PICKAXE', powerMsg: 'PICKAXE POWER!',
      pal: { H: '#5c3b1e', S: '#f1c27d', E: '#1b1b1b', B: '#4a2f17', M: '#9c4a3c', T: '#c92a2a', U: '#7a1515', P: '#3b5bdb', K: '#2b2b2b', W: '#ffffff' }
    },
    shea: {
      name: 'SHEA', wife: 'heather', power: 'CANDY CANE', powerMsg: 'CANDY CANE POWER!',
      pal: { H: '#c59a5b', S: '#f3cfa0', E: '#1b1b1b', B: '#f3cfa0', M: '#b5543f', T: '#2f9e44', U: '#1b6e2e', P: '#a07850', K: '#3b2a1a', W: '#ffffff' }
    }
  };
  var WIVES = {
    emily: { name: 'EMILY', pal: { H: '#6b3e1f', S: '#f5cfa8', E: '#1b1b1b', M: '#d6336c', D: '#9c36b5', W: '#ffd6f5', K: '#5a1e6b' } },
    heather: { name: 'HEATHER', pal: { H: '#f2d06b', S: '#f7d8b5', E: '#1b1b1b', M: '#d6336c', D: '#0ca678', W: '#c3fae8', K: '#08594a' } }
  };
  var PICKAXE = ['.GGGGGGGG...','GLLLLLLLLGG.','GG...WW...GG','G....WW....G','.....WW.....','.....wW.....','.....Ww.....','.....wW.....','.....Ww.....','.....wW.....','.....Ww.....','.....ww.....'];
  var PICK_PAL = { G: '#495057', L: '#ced4da', W: '#b07a3c', w: '#7a4f22' };
  var CANE_HOOK = ['..RRWW..','.WR..RW.','RW....WR','W......R','.......W','.......R'];
  var CANE_PAL = { R: '#e03131', W: '#ffffff' };

  // Draw a pixel map; flip = mirror horizontally (facing left).
  function drawMap(map, pal, x, y, flip, sc) {
    sc = sc || 1; var w = map[0].length;
    for (var r = 0; r < map.length; r++) {
      var row = map[r];
      for (var c = 0; c < w; c++) {
        var ch = row[c];
        if (ch === '.') continue;
        var col = pal[ch]; if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(x + (flip ? (w - 1 - c) : c) * sc, y + r * sc, sc, sc);
      }
    }
  }

  // ---- themes & levels ---------------------------------------------------------
  var THEMES = [
    { name: 'GODZILLA RAMPAGE', sky: ['#120d2e', '#3a2470'], girder: '#e0457b', dark: '#8f1f4a', rivet: '#ffd1e0', ladder: '#5ad1e8', deco: 'city', barrel: 'barrel', cart: 'barrel', drop: 'coal' },
    { name: 'COAL MINE CHAOS', sky: ['#0d0a07', '#33241a'], girder: '#a8713f', dark: '#5a3a1e', rivet: '#e6c28f', ladder: '#d1a865', deco: 'mine', barrel: 'barrel', cart: 'cart', drop: 'coal' },
    { name: 'CHRISTMAS CHAOS', sky: ['#06213d', '#13597e'], girder: '#e8f4ff', dark: '#7fa6c9', rivet: '#ff4d4d', ladder: '#4dd17a', deco: 'xmas', barrel: 'present', cart: 'snowball', drop: 'ornament' },
    { name: 'KAIJU SHOWDOWN', sky: ['#2a0606', '#8a2410'], girder: '#ff8a1f', dark: '#8a3b00', rivet: '#ffe08a', ladder: '#ffd23f', deco: 'fire', barrel: 'firebarrel', cart: 'boulder', drop: 'rock' }
  ];
  // Girders: x1..x2, top surface y at the left (yL) and right (yR) ends.
  // They alternate their slope, so barrels zig-zag down; index 6 is the
  // rescue ledge above Godzilla.
  var G = [
    { x1: 0, x2: 192, yL: 276, yR: 270 },
    { x1: 0, x2: 176, yL: 234, yR: 240 },
    { x1: 16, x2: 192, yL: 198, yR: 192 },
    { x1: 0, x2: 176, yL: 156, yR: 162 },
    { x1: 16, x2: 192, yL: 120, yR: 114 },
    { x1: 0, x2: 152, yL: 78, yR: 82 },
    { x1: 84, x2: 128, yL: 44, yR: 44 }
  ];
  // Ladders [lower girder, x, broken?]; the ledge ladder (5 → 6 at x 118) is always there.
  var LEVELS = [
    { ladders: [[0, 150], [0, 60, 1], [1, 30], [1, 100], [2, 160], [2, 80, 1], [3, 28], [3, 110], [4, 136], [4, 70, 1]],
      holes: [], tools: [[2, 120]], icy: [], throwEvery: 3.1, speed: 40, ladderChance: 0.22, cartChance: 0, dropEvery: 0, fire: 0 },
    { ladders: [[0, 40], [0, 140, 1], [1, 150], [1, 90, 1], [2, 30], [2, 120], [3, 160], [3, 60, 1], [4, 100]],
      holes: [[2, 96, 106], [4, 40, 50]], tools: [[1, 100], [3, 120]], icy: [], throwEvery: 2.6, speed: 46, ladderChance: 0.28, cartChance: 0.35, dropEvery: 5.5, fire: 0 },
    { ladders: [[0, 100], [0, 30, 1], [1, 160], [2, 60], [2, 130, 1], [3, 150], [4, 40], [4, 120, 1]],
      holes: [[3, 90, 100]], tools: [[1, 40], [4, 90]], icy: [1, 3], throwEvery: 2.3, speed: 50, ladderChance: 0.33, cartChance: 0.3, dropEvery: 4.6, fire: 0 },
    { ladders: [[0, 160], [1, 20], [1, 120, 1], [2, 170], [3, 30], [3, 90, 1], [4, 140]],
      holes: [[1, 70, 80], [2, 140, 150], [4, 100, 110]], tools: [[2, 60], [3, 140]], icy: [], throwEvery: 1.9, speed: 56, ladderChance: 0.38, cartChance: 0.3, dropEvery: 3.8, fire: 2 }
  ];

  var WALK = 52, CLIMB = 36, JUMPV = 128, GRAV = 470, FALL_DEATH = 26, TOOL_TIME = 10;
  var GZ_X = 4, GZ_W = 50; // Godzilla stands on girder 5 from x 4 to 54

  // ---- state --------------------------------------------------------------------
  var S = {
    mode: 'select', // select | intro | play | dying | rescue | tally | gameover | win
    hero: 'chris', sel: 0, level: 0, round: 0, score: 0, hi: Math.max(0, INIT.highScore | 0),
    lives: 3, extraGiven: false, t: 0, modeT: 0, bonus: 5000, bonusT: 0,
    player: null, hz: [], tools: [], parts: [], pops: [], msgs: [], snow: [],
    gz: { state: 'idle', t: 0, throwT: 2, dropT: 4, roarT: 6, mood: 0, shake: 0, firstThrow: true },
    holes: [], ladders: [], shakeT: 0, paused: false, sentScore: false
  };
  var bgLayer = document.createElement('canvas'), fgLayer = document.createElement('canvas');
  bgLayer.width = fgLayer.width = W; bgLayer.height = fgLayer.height = H;

  function lvl() { return LEVELS[S.level]; }
  function theme() { return THEMES[S.level]; }
  function hard() { return Math.pow(1.15, S.round); }

  // ---- geometry -----------------------------------------------------------------
  function solidAt(gi, x) {
    var g = G[gi]; if (x < g.x1 || x > g.x2) return false;
    var hs = S.holes[gi] || [];
    for (var i = 0; i < hs.length; i++) if (x >= hs[i][0] && x <= hs[i][1]) return false;
    return true;
  }
  function surf(gi, x) {
    var g = G[gi]; var cx = Math.min(g.x2 - 0.01, Math.max(g.x1, x));
    var mid = g.x1 + Math.floor((cx - g.x1) / 8) * 8 + 4;
    return Math.round(g.yL + (g.yR - g.yL) * (mid - g.x1) / (g.x2 - g.x1));
  }
  function downhill(gi) { var g = G[gi]; return g.yR > g.yL ? 1 : -1; }

  // ---- sound (Web Audio, synthesized) -----------------------------------------------
  var AC = null, muted = false, master = null;
  try { muted = localStorage.getItem('rampage.muted') === '1'; } catch (e) { /* storage off */ }
  function audio() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    if (master) master.gain.value = muted ? 0 : 1;
    return AC;
  }
  function tone(f, d, type, vol, slideTo, delay) {
    var a = audio(); if (!a || muted) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + d);
    g.gain.setValueAtTime(vol || 0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.02);
  }
  function noise(d, vol, freq, delay) {
    var a = audio(); if (!a || muted) return;
    var t0 = a.currentTime + (delay || 0), n = Math.floor(a.sampleRate * d);
    var buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
    for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'lowpass'; f.frequency.value = freq || 800; g.gain.value = vol || 0.12;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(master); src.start(t0);
  }
  var SFX = {
    jump: function () { tone(420, 0.14, 'square', 0.045, 820); },
    over: function () { tone(880, 0.06, 'square', 0.04); tone(1320, 0.08, 'square', 0.04, 0, 0.06); },
    smash: function () { noise(0.22, 0.16, 1400); tone(140, 0.18, 'sawtooth', 0.06, 50); },
    pick: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.1, 'square', 0.045, 0, i * 0.07); }); },
    die: function () { tone(660, 0.9, 'square', 0.05, 80); },
    roar: function () { noise(0.9, 0.18, 380); tone(95, 0.9, 'sawtooth', 0.07, 55); },
    stomp: function () { tone(70, 0.2, 'sine', 0.22, 40); noise(0.12, 0.08, 300); },
    swing: function () { noise(0.12, 0.06, 2500); },
    climb: function () { tone(330, 0.03, 'triangle', 0.025); },
    tick: function () { tone(1200, 0.03, 'square', 0.025); },
    oneup: function () { [784, 988, 1175, 1568].forEach(function (f, i) { tone(f, 0.09, 'square', 0.045, 0, i * 0.08); }); },
    rescue: function () { [523, 659, 784, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.16, 'square', 0.05, 0, i * 0.14); }); },
    over2: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.28, 'triangle', 0.06, 0, i * 0.26); }); }
  };
  // A tiny chiptune loop per level while playing (bass + blips).
  var MUSIC = [
    [55, 0, 55, 65, 73, 0, 65, 55], [49, 0, 49, 58, 49, 0, 44, 0], [65, 82, 98, 82, 73, 87, 110, 87], [55, 55, 82, 55, 52, 52, 78, 52]
  ];
  var musicT = 0, musicStep = 0;
  function music(dt) {
    if (S.mode !== 'play' || muted) return;
    musicT -= dt;
    if (musicT <= 0) {
      musicT += 0.17 / Math.min(1.25, 0.95 + S.level * 0.08);

  // ---- Godzilla ----------------------------------------------------------------------

  // ---- player ---------------------------------------------------------------------------
  function ladderNear(gi, x, atTop) {
    for (var i = 0; i < S.ladders.length; i++) {
      var l = S.ladders[i];

  }
  function updatePlayer(dt) {
    var p = S.player, L = lvl();
    if (p.cd > 0) p.cd -= dt;
    if (p.swing > 0) p.swing -= dt;

      p.tool -= dt;
      if (p.tool <= 0) { p.tool = 0; tone(300, 0.3, 'square', 0.04, 120); }
    }

  // ---- hazards ----------------------------------------------------------------------------
  function updateHazards(dt) {
    var L = lvl(), p = S.player, sp = L.speed * hard();
    for (var i = S.hz.length - 1; i >= 0; i--) {
      var h = S.hz[i];
      if (h.kind === 'drop') {

        h.vy = Math.min(150, h.vy + GRAV * 0.5 * dt); h.y += h.vy * dt;
        if (h.y > H + 10) { S.hz.splice(i, 1); continue; }
      } else if (h.kind === 'fire') {
        updateFire(h, dt);
      } else if (h.st === 'roll') {
        var prevX = h.x;
        h.x += h.dir * sp * h.fast * dt; h.spin += h.dir * dt * 10;
        if (h.kind === 'barrel') {

            if (l.hi !== h.g || l.hi === 6) continue;
            if ((prevX - l.x) * (h.x - l.x) <= 0 && Math.random() < L.ladderChance + (p && p.g < h.g && Math.abs(p.x - l.x) < 40 ? 0.25 : 0)) {

            }

  // ---- main update -----------------------------------------------------------------------
  function update(dt) {

        else { resetRun(); setMode('intro'); say(WIVES[HEROES[S.hero].wife].name + ' NEEDS YOU!', 1.8, '#ff8cc6'); }
      }
    } else if (S.mode === 'rescue') {

    var k = p.swing > 0 ? 1 - p.swing / 0.28 : 0;
    var ang = p.swing > 0 ? (-1.9 + k * 3.4) : -0.5;
    var flash = p.tool < 2 && Math.floor(S.t * 10) % 2;
    if (flash) return;
    ctx.save(); ctx.translate(hx, hy); ctx.scale(p.face, 1); ctx.rotate(ang);
    if (S.hero === 'chris') { ctx.scale(1.4, 1.4); drawMap(PICKAXE, PICK_PAL, -6, -11, false); }
    else { drawCane(-7, -26, 1); }
    ctx.restore();
    if (p.swing > 0.12) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      var ax = Math.round(p.x) + p.face * 14;
      ctx.fillRect(ax - 1, hy - 14, 3, 18);
    }
    void hero;
  }

  // ---- HUD & screens ----------------------------------------------------------------------
  function pad6(n) { var s = String(n); while (s.length < 6) s = '0' + s; return s; }
  function drawHUD() {
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, HUD);
    text('SCORE', 4, 2, 1, '#ff6b6b'); text(pad6(S.score), 4, 11, 1, '#ffffff');
    text('HIGH SCORE', W / 2, 2, 1, '#ff6b6b', 'c'); text(pad6(S.hi), W / 2, 11, 1, '#ffffff', 'c');
    text('L' + (S.level + 1), W - 4, 2, 1, '#74c0fc', 'r');
    var lives = '';
    for (var i = 0; i < Math.min(S.lives, 5); i++) lives += '*';
    text(lives || '-', W - 4, 11, 1, '#ff8cc6', 'r');
    var p = S.player;
    if (p && p.tool > 0 && (S.mode === 'play' || S.mode === 'dying')) {
      var w = Math.round((W - 8) * p.tool / TOOL_TIME);
      ctx.fillStyle = '#3b2a00'; ctx.fillRect(4, HUD, W - 8, 3);
      ctx.fillStyle = p.tool < 2 ? (Math.floor(S.t * 10) % 2 ? '#ff6b6b' : '#ffa94d') : '#ffa94d'; ctx.fillRect(4, HUD, w, 3);
    }
    if (S.mode === 'play' || S.mode === 'intro' || S.mode === 'dying') {
      text('BONUS ' + S.bonus, W - 4, HUD + 5, 1, '#ffd43b', 'r', '#000000');
    }
  }
  function drawMessages() {
    var y = 132;
    S.msgs.slice(-2).forEach(function (m) {
      if (m.t < 0.4 && Math.floor(m.t * 20) % 2) return;
      var sc = textW(m.txt, 2) <= W - 8 ? 2 : 1;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; var w = textW(m.txt, sc) + 10; ctx.fillRect(Math.round(W / 2 - w / 2), y - 4, w, 7 * sc + 8);
      text(m.txt, W / 2, y, sc, m.col, 'c', '#000000');
      y += 7 * sc + 12;
    });
  }
  function drawIntro() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 70, W, 50);
    text('LEVEL ' + (S.level + 1), W / 2, 76, 2, '#ffffff', 'c', '#c2255c');
    text(theme().name, W / 2, 98, 1, '#ffd43b', 'c');
    if (Math.floor(S.t * 3) % 2) text('TAP OR JUMP TO GO', W / 2, 108, 1, '#adb5bd', 'c');
  }
  function drawTally() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 196, W, 34);
    text('BONUS ' + S.bonus, W / 2, 202, 2, '#ffd43b', 'c', '#000000');
  }
  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, HUD, W, H - HUD);
    if (Math.floor(S.t * 3) % 3) text('GAME OVER', W / 2, 70, 3, '#ff6b6b', 'c', '#5c0f1f');
    var hero = HEROES[S.hero], wife = WIVES[hero.wife];
    text(hero.name + ' AND ' + wife.name, W / 2, 110, 1, '#ff8cc6', 'c');
    text('NEED YOU!', W / 2, 122, 2, '#ff8cc6', 'c');
    text('SCORE ' + S.score, W / 2, 150, 1, '#ffffff', 'c');
    if (S.score >= S.hi && S.score > 0) text('NEW HIGH SCORE!', W / 2, 162, 1, '#ffd43b', 'c');
  }
  function drawWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 190, W, 50);
    text('ALL 4 LEVELS CLEARED!', W / 2, 196, 1, '#69db7c', 'c');
    text('NEXT: ROUND ' + (S.round + 2), W / 2, 208, 1, '#ffffff', 'c');
    if (S.modeT > 1.5 && Math.floor(S.t * 3) % 2) text('TAP TO KEEP GOING', W / 2, 222, 1, '#adb5bd', 'c');
  }
  function drawSelect() {
    var gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#120d2e'); gr.addColorStop(1, '#3a2470');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < 40; i++) { ctx.fillStyle = '#ffffff'; ctx.fillRect((i * 53) % W, (i * 37) % 80 + 2, 1, 1); }
    text('GODZILLA', W / 2, 14, 3, '#69db7c', 'c', '#145a24');
    text('RAMPAGE', W / 2, 40, 3, '#ff6b6b', 'c', '#5c0f1f');
    if (Math.floor(S.t * 2.5) % 2) text('CHOOSE YOUR HERO', W / 2, 74, 1, '#ffd43b', 'c');
    panel('chris', 96, S.sel === 0);
    panel('shea', 176, S.sel === 1);
    text('HIGH SCORE ' + pad6(S.hi), W / 2, 258, 1, '#ffffff', 'c');
    text('TAP A HERO TO START', W / 2, 270, 1, '#adb5bd', 'c');
  }
  function panel(key, y, on) {
    var hero = HEROES[key], wife = WIVES[hero.wife];
    ctx.fillStyle = on ? '#4a3a9c' : '#241b52'; ctx.fillRect(8, y, W - 16, 72);
    ctx.fillStyle = on && Math.floor(S.t * 4) % 2 ? '#ffd43b' : (on ? '#ff8cc6' : '#3b2f7a');
    ctx.fillRect(8, y, W - 16, 2); ctx.fillRect(8, y + 70, W - 16, 2); ctx.fillRect(8, y, 2, 72); ctx.fillRect(W - 10, y, 2, 72);
    var bob = on ? Math.round(Math.sin(S.t * 6)) : 0;
    drawMap(Math.floor(S.t * 4) % 2 && on ? HERO_FRAMES.walk1 : HERO_FRAMES.stand, hero.pal, 16, y + 12 + bob, false, 3);
    text(hero.name, 62, y + 8, 2, '#ffffff', null, '#000000');
    text('POWER: ' + hero.power, 62, y + 30, 1, '#ffa94d');
    text('MISSION:', 62, y + 44, 1, '#74c0fc');
    text('RESCUE ' + wife.name, 62, y + 54, 1, '#ff8cc6');
    if (key === 'chris') { ctx.save(); ctx.translate(166, y + 22); drawMap(PICKAXE, PICK_PAL, -6, -6, false); ctx.restore(); }
    else drawCane(160, y + 6, 1);
  }

  // ---- loop & layout ---------------------------------------------------------------------
  var k = 1;
  function layout() {
    var st = document.getElementById('stage');
    var aw = st.clientWidth, ah = st.clientHeight, dpr = window.devicePixelRatio || 1;
    var scale = Math.min(aw / W, ah / H);
    k = Math.max(1, Math.floor(scale * dpr));
    cvs.width = W * k; cvs.height = H * k;
    cvs.style.width = (W * k / dpr) + 'px'; cvs.style.height = (H * k / dpr) + 'px';
    ctx.setTransform(k, 0, 0, k, 0, 0); ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', layout);
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
    if (!S.paused) update(dt);
    ctx.setTransform(k, 0, 0, k, 0, 0); ctx.imageSmoothingEnabled = false;
    render();
    var atk = document.getElementById('atk');
    var ready = S.player && S.player.tool > 0 && S.mode === 'play';
    if (atk.classList.contains('ready') !== !!ready) atk.classList.toggle('ready', !!ready);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () { S.paused = document.hidden; last = 0; });

  // Testing / debugging hooks (the host only enables cheats in development).
  window.__rampage = {
    get mode() { return S.mode; }, get score() { return S.score; }, get lives() { return S.lives; }, get level() { return S.level + 1; },
    get hero() { return S.hero; }, get hi() { return S.hi; },
    get player() { return S.player && { x: S.player.x, y: S.player.y, st: S.player.st, g: S.player.g, tool: S.player.tool }; },
    get hazards() { return S.hz.length; }
  };
  if (INIT.debug) {
    window.__rampage.debug = {
      giveTool: function () { if (S.player) { S.player.tool = TOOL_TIME; } },
      rescue: function () { if (S.mode === 'play') { S.player.g = 6; rescue(); } },
      die: function () { die('hit'); },
      gameOver: function (score) { S.score = score | 0; if (S.score > S.hi) S.hi = S.score; S.lives = 0; die('hit'); },
      spawnBarrelAt: function (x) { var p = S.player; S.hz.push({ kind: 'barrel', look: 'barrel', x: x, y: surf(p.g, x), g: p.g, dir: x > p.x ? -1 : 1, st: 'roll', vy: 0, r: 5, spin: 0, jumped: false, bounced: false, fast: 0.01 }); },
      pause: function (on) { S.paused = !!on; },
      setLevel: function (n) { S.level = Math.max(0, Math.min(3, n - 1)); startLevel(); }
    };
  }

  layout();
  requestAnimationFrame(frame);
  post({ type: 'ready' });
})();
</script>
</body>
</html>
