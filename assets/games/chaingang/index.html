<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Tug of Wall</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a0b2e; overflow: hidden; }
  body {
    box-sizing: border-box; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, sans-serif; color: #fff;
  }
  #stage { position: absolute; inset: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; touch-action: none; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
  #pausebtn { position: absolute; z-index: 4; right: 10px; top: 10px; width: 44px; height: 44px; border-radius: 22px; border: 0; padding: 0;
    color: #fff; font: 900 15px system-ui, sans-serif; letter-spacing: -1px;
    background: rgba(26,11,46,0.6); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.4); }
  button:focus-visible { outline: 3px solid #ffe11a; }
  #pause { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(26,11,46,0.55); z-index: 5; }
  #pause.show { display: flex; }
  .card { display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: 220px; padding: 22px 20px; border-radius: 24px;
    background: linear-gradient(#5b1a8c, #2a0a5c); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 0 3px #1a0b2e, 0 12px 30px rgba(0,0,0,0.5); }
  .title { font: 900 28px "Arial Black", system-ui, sans-serif; color: #ff2d95; text-align: center; letter-spacing: 1px; margin-bottom: 4px;
    text-shadow: -2px -2px 0 #1a0b2e, 2px -2px 0 #1a0b2e, -2px 2px 0 #1a0b2e, 2px 2px 0 #1a0b2e, 3px 4px 0 #1a0b2e; }
  .card button, #over button { font: 900 16px "Arial Black", system-ui, sans-serif; letter-spacing: 0.5px; min-height: 52px; padding: 0 20px; border-radius: 26px; border: 0; color: #1a0b2e;
    background: linear-gradient(#fff36b, #ffc23a); box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 5px 0 #b06a00, 0 0 0 2.5px #1a0b2e; }
  button.alt { color: #fff !important; background: linear-gradient(#5ff0ff, #0fa3d6) !important; box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), 0 5px 0 #075a80, 0 0 0 2.5px #1a0b2e !important; }
  button.quit { color: #fff !important; margin-top: 10px; background: linear-gradient(#ff6fb5, #e0157a) !important; box-shadow: inset 0 3px 0 rgba(255,255,255,0.35), 0 5px 0 #7a0a40, 0 0 0 2.5px #1a0b2e !important; }
  #over { position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: center; padding-bottom: 16%; gap: 12px; z-index: 3; pointer-events: none; }
  #over.show { display: flex; }
  #over button { pointer-events: auto; }
  /* The pad: a joystick on the left to walk; JUMP and GRAB on the right.
     --u sizes it from the screen. */
  #pad { --u: clamp(44px, calc((100vw - 60px) / 6.8), 64px); position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: none;
    align-items: flex-end; justify-content: space-between; padding: 0 16px 16px; pointer-events: none; }
  #pad.show { display: flex; }
  .stick { position: relative; width: calc(var(--u) * 2.6 + 18px); height: calc(var(--u) * 2.6 + 18px); border-radius: 50%; touch-action: none; pointer-events: auto;
    background: radial-gradient(circle, rgba(26,11,46,0.6) 0 55%, rgba(255,255,255,0.08) 72%, rgba(255,255,255,0.03));
    box-shadow: inset 0 0 0 2px rgba(255,45,149,0.45), inset 0 8px 18px rgba(0,0,0,0.5); }
  .stick .mark { position: absolute; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.35); font-size: 15px; line-height: 1; pointer-events: none; }
  .stick .ml { left: 11px; } .stick .mr { right: 11px; }
  .stick .mu, .stick .md { left: 50%; top: auto; transform: translateX(-50%); }
  .stick .mu { top: 9px; } .stick .md { bottom: 9px; }
  .stick[data-dir~="L"] .ml, .stick[data-dir~="R"] .mr, .stick[data-dir~="U"] .mu, .stick[data-dir~="D"] .md { color: #ffe11a; }
  .knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 1.2); height: calc(var(--u) * 1.2); margin: calc(var(--u) * -0.6) 0 0 calc(var(--u) * -0.6);
    border-radius: 50%; pointer-events: none; transition: transform 0.14s cubic-bezier(.3,1.6,.5,1);
    background: radial-gradient(circle at 36% 30%, #ff9ad0, #ff2d95 55%, #a3115e);
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), 0 6px 0 #5a0a35, 0 0 0 2.5px #1a0b2e, 0 10px 16px rgba(0,0,0,0.45); }
  .stick.on .knob { transition: none; }
  .btns { display: flex; align-items: flex-end; gap: 12px; pointer-events: none; }
  .btns button { pointer-events: auto; touch-action: none; border-radius: 50%; border: 0; padding: 0; color: #1a0b2e;
    font: 900 calc(var(--u) * 0.34) "Arial Black", system-ui, sans-serif; letter-spacing: 0.3px; }
  #jumpbtn { width: calc(var(--u) * 1.65); height: calc(var(--u) * 1.65); margin-bottom: calc(var(--u) * 0.9);
    background: radial-gradient(circle at 38% 30%, #fff7a8, #ffe11a 60%, #c99a00);
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 6px 0 #7a5a00, 0 0 0 2.5px #1a0b2e, 0 10px 18px rgba(0,0,0,0.45); }
  #grabbtn { width: calc(var(--u) * 1.45); height: calc(var(--u) * 1.45); color: #fff;
    background: radial-gradient(circle at 38% 30%, #9af6ff, #18e0ff 60%, #0a8fb0);
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.45), 0 6px 0 #075a70, 0 0 0 2.5px #1a0b2e, 0 10px 18px rgba(0,0,0,0.45); text-shadow: 0 1px 0 #075a70; }
  .btns button.on { transform: translateY(4px); }
  /* emotes: a bubble button above the joystick, and its four choices */
  #emotebtn { position: absolute; left: 16px; bottom: calc(var(--u) * 2.6 + 34px); width: 44px; height: 44px; border-radius: 22px; border: 0; padding: 0;
    pointer-events: auto; font-size: 20px; background: rgba(26,11,46,0.6); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.4); }
  #emotes { position: absolute; left: 68px; bottom: calc(var(--u) * 2.6 + 30px); display: none; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 90px); pointer-events: auto; }
  #emotes.show { display: flex; }
  #emotes button { min-height: 44px; padding: 0 12px; border-radius: 22px; border: 0; color: #1a0b2e; font: 900 13px "Arial Black", system-ui, sans-serif;
    background: #fff; box-shadow: 0 3px 0 #b9a6d6, 0 0 0 2px #1a0b2e; }
</style>
</head>
<body>
<div id="stage" role="application" aria-label="Tug of Wall. Push the joystick to walk (the camera follows you; drag the screen to look round), JUMP to jump, hold GRAB to anchor the rope (and reel in a teammate hanging below) or catch a zip line. 1 to 4 say something. Arrow keys or WASD, Space and Shift work too; Q and R look round.">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="hud" role="img" aria-label="Tug of Wall"></canvas>
  <button id="pausebtn" aria-label="Pause" type="button">❚❚</button>
  <div id="pause" role="dialog" aria-modal="true" aria-label="Paused">
    <div class="card">
      <div class="title">PAUSED</div>
      <button id="resume" type="button">RESUME</button>
      <button id="restart" class="alt" type="button" aria-label="Restart this stretch from the beginning">RESTART STRETCH</button>
      <button id="psound" class="alt" type="button">SOUND: ON</button>
      <button id="pmusic" class="alt" type="button">MUSIC: ON</button>
      <button id="exit" class="quit" type="button" aria-label="Leave the game">LEAVE GAME</button>
    </div>
  </div>
  <div id="pad">
    <button id="emotebtn" type="button" aria-label="Say something to the gang" aria-expanded="false">💬</button>
    <div id="emotes" role="group" aria-label="Say">
      <button type="button" data-k="0">👋 HI!</button><button type="button" data-k="1">⏳ WAIT!</button><button type="button" data-k="2">➡️ THIS WAY!</button><button type="button" data-k="3">🙌 NICE!</button>
    </div>
    <div class="stick" role="img" aria-label="Joystick: push to walk, the way the camera looks (arrow keys or WASD work too)">
      <span class="mark ml" aria-hidden="true">◀</span><span class="mark mr" aria-hidden="true">▶</span><span class="mark mu" aria-hidden="true">▲</span><span class="mark md" aria-hidden="true">▼</span>
      <div class="knob"></div>
    </div>
    <div class="btns">
      <button id="grabbtn" type="button" aria-label="Grab: hold to dig in and anchor the gang, or catch a zip line">GRAB</button>
      <button id="jumpbtn" type="button" aria-label="Jump (when dangling, climb the rope)">JUMP</button>
    </div>
  </div>
  <div id="over">
    <button id="again" type="button">PLAY AGAIN</button>
    <button id="leave" class="alt" type="button">LEAVE</button>
  </div>
</div>
<script>window.CHAINGANG_INIT = /*INIT*/null;</script>
<script>/*GAME*/</script>
</body>
</html>
